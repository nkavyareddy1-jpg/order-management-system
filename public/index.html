<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Management System</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <div>
      <h1>Order Management System</h1>
      <p>Manage your orders easily</p>
    </div>
    <button id="darkModeBtn" type="button">🌙 Dark Mode</button>
  </header>

  <main class="container">
    <section>
      <h2>Dashboard</h2>
      <div class="dashboard">
        <article class="card"><h3>Total Orders</h3><p id="totalOrders">0</p></article>
        <article class="card"><h3>Pending Orders</h3><p id="pendingOrders">0</p></article>
        <article class="card"><h3>Delivered Orders</h3><p id="deliveredOrders">0</p></article>
        <article class="card"><h3>Total Revenue</h3><p id="totalRevenue">₹0.00</p></article>
      </div>
    </section>

    <section class="panel">
      <h2 id="formTitle">Add New Order</h2>
      <form id="orderForm">
        <label for="customerName">Customer Name</label>
        <input id="customerName" type="text" maxlength="80" placeholder="Enter customer name" required>
        <label for="product">Product</label>
        <input id="product" type="text" maxlength="100" placeholder="Enter product name" required>
        <label for="quantity">Quantity</label>
        <input id="quantity" type="number" min="1" step="1" placeholder="Enter quantity" required>
        <label for="price">Price (₹)</label>
        <input id="price" type="number" min="0.01" step="0.01" placeholder="Enter price" required>
        <label for="status">Status</label>
        <select id="status">
          <option>Pending</option><option>Processing</option><option>Shipped</option><option>Delivered</option>
        </select>
        <div class="form-actions">
          <button id="submitBtn" type="submit">Add Order</button>
          <button id="cancelEditBtn" class="secondary hidden" type="button">Cancel Edit</button>
        </div>
      </form>
      <p id="message" class="message" role="status"></p>
    </section>

    <section class="panel">
      <h2>Orders</h2>
      <div class="tools">
        <input id="searchInput" type="search" placeholder="Search customer or product...">
        <select id="filterStatus">
          <option value="All">All Orders</option>
          <option>Pending</option><option>Processing</option><option>Shipped</option><option>Delivered</option>
        </select>
        <button id="refreshBtn" class="secondary" type="button">Refresh</button>
      </div>
      <div class="table-container">
        <table>
          <thead><tr>
            <th>Order ID</th><th>Customer</th><th>Product</th><th>Quantity</th>
            <th>Price</th><th>Total</th><th>Date</th><th>Status</th><th>Actions</th>
          </tr></thead>
          <tbody id="orderTableBody">
            <tr><td colspan="9">Loading orders...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="panel chart-section">
      <h2>Order Status Chart</h2>
      <canvas id="orderChart"></canvas>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
